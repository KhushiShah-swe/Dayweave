name: Feature idea
description: Suggest a focused improvement.
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Who needs this, and what does it help them accomplish?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Acceptance criteria
      description: Describe observable behavior that would demonstrate completion.
    validations:
      required: true
