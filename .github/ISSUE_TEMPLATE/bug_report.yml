name: Bug report
description: Report a reproducible problem in Dayweave.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce. Use fictional data; do not include secrets or personal activity.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Workspace mode
      options:
        - Browser demo
        - Authenticated API
        - Build or setup
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node/.NET version, and relevant error text with credentials removed.
